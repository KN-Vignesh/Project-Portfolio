# SonarQube Project Configuration
sonar.projectKey=Project-Portfolio
sonar.projectName=Project-Portfolio
sonar.sourceEncoding=UTF-8

# Source Code Paths
sonar.sources=src,server.ts

# File Exclusions from Analysis
sonar.exclusions=**/node_modules/**,**/dist/**,public/**

# Copy-Paste Detection (CPD) Duplication Exclusions
# Exclude embedded code string datasets, PR diff fixtures, and build generation scripts
sonar.cpd.exclusions=src/data/**,src/vero/server/sampleFixtures.ts,scripts/**

# Javascript / Typescript Environment
sonar.javascript.environments=browser,node
