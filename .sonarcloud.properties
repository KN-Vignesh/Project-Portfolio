# SonarCloud Configuration for Automatic & CI Analysis
# Documentation: https://docs.sonarsource.com/sonarcloud/advanced-setup/analysis-scope/

sonar.projectKey=KN-Vignesh_Project-Portfolio
sonar.organization=kn-vignesh
sonar.projectName=Project-Portfolio
sonar.sourceEncoding=UTF-8

# Source Code Paths
sonar.sources=src,server.ts

# File Exclusions from Analysis
sonar.exclusions=**/node_modules/**,**/dist/**,public/**,tests/**

# Copy-Paste Detection (CPD) Duplication Exclusions
# Exclude embedded static datasets, PR diff fixtures, mock registries, and build scripts
sonar.cpd.exclusions=src/data/**,src/vero/server/sampleFixtures.ts,scripts/**,guardian/**
